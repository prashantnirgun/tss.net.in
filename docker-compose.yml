services:
  tss-vitepress:
    container_name: "tss-container"
    image: "tss-image"
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/docs
    ports:
      # Vite's dev server, not 8080
      - "5173:5173"
    volumes:
      - .:/app
      # node_modules lives in docs/, so keep the image's copy there
      - /app/docs/node_modules
    command: npm run dev -- --host 0.0.0.0
